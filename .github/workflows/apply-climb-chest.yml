name: Apply Studio Climb Chest

on:
  push:
    branches: [agent/climb-chest]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/climb-chest
      - name: Apply guarded source changes
        run: python3 tools/apply_climb_chest.py
      - name: Run Studio tests
        run: npm test
      - name: Commit source changes
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js lib/format.mjs tests/format.test.mjs index.html README.md
          git commit -m "Add Climb Chest power-up and preview mechanics"
          git push origin HEAD:agent/climb-chest
