name: Apply TI AppVar entry fix

on:
  push:
    branches: [agent/fix-ti-appvar-entry-length]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-ti-appvar-entry-length
      - name: Apply guarded fix
        run: python3 tools/apply_ti_appvar_entry_fix.py
      - name: Run tests
        run: npm test
      - name: Commit fixed source and tests
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/format.mjs tests/format.test.mjs
          git commit -m "Fix TI AppVar entry-data length"
          git push origin HEAD:agent/fix-ti-appvar-entry-length
