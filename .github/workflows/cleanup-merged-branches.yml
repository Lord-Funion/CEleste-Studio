name: Clean merged work branches

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Delete fully merged work branches
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin '+refs/heads/*:refs/remotes/origin/*'

          while IFS= read -r ref; do
            branch="${ref#origin/}"
            if git merge-base --is-ancestor "$ref" origin/main; then
              echo "Deleting merged branch: $branch"
              git push origin --delete "$branch"
            else
              echo "Keeping unmerged branch: $branch"
            fi
          done < <(git for-each-ref --format='%(refname:short)' \
            'refs/remotes/origin/agent/*' \
            'refs/remotes/origin/assistant/*')
