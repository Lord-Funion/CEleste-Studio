name: Apply Studio per-source fruit persistence

on:
  push:
    branches: [agent/per-source-fruit-state]
    paths:
      - .github/studio-per-source.patch
      - .github/workflows/apply-studio-per-source.yml
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/per-source-fruit-state
      - name: Apply preview persistence patch
        run: |
          git apply --check .github/studio-per-source.patch
          git apply .github/studio-per-source.patch
          git diff --check
          node --check app.js
          npm test
      - name: Commit implementation
        run: |
          git config user.name "Lord-Funion Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add app.js
          git commit -m "Track Studio strawberries by source"
          git push origin HEAD:agent/per-source-fruit-state
