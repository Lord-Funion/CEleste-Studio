name: One-shot Studio QoL polish

on:
  push:
    paths:
      - '.github/workflows/one-shot-qol-polish.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply Studio polish
        run: python .github/scripts/apply_qol_polish.py
      - name: Run tests
        run: npm test
      - name: Commit product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html app.js README.md tests/public-sharing.test.mjs
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "Polish Studio room workflow and sharing UI"
            git push
          fi
