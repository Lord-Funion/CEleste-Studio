name: Fix terrain IDs and exit behavior

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-terrain-and-exit.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Studio
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          p=Path('app.js')
          s=p.read_text()

          old="""const paletteItems = [
  {id:0,name:'Empty',color:'#090811'}, {id:2,name:'Rock A',color:'#6d586f'}, {id:3,name:'Rock B',color:'#8a718d'},
  {id:4,name:'Ice',color:'#7ee5ef'}, {id:5,name:'Snow',color:'#edfaff'}, {id:17,name:'Spikes',color:'#cfd7e7'},
  {id:27,name:'Spikes alt',color:'#9da9ba'}, {id:1,name:'Player spawn',color:'#ff557f',special:'spawn'},
  {id:118,name:'Finish flag',color:'#80e78b',special:'exit'}, {id:18,name:'Spring',color:'#e54b67',entity:true},
  {id:22,name:'Dash balloon',color:'#79d8f5',entity:true}, {id:23,name:'Falling floor',color:'#e7ba62',entity:true},
  {id:26,name:'Strawberry',color:'#f44762',entity:true}, {id:28,name:'Flying berry',color:'#ff7790',entity:true},
  {id:64,name:'Fake wall',color:'#5f4564',entity:true}, {id:8,name:'Key',color:'#ffe66b',entity:true},
  {id:20,name:'Chest',color:'#ce9250',entity:true}, {id:11,name:'Platform left',color:'#a989d2',entity:true},
  {id:12,name:'Platform right',color:'#bba2e8',entity:true}, {id:86,name:'Message',color:'#e7e4ff',entity:true},
  {id:96,name:'Big chest',color:'#d9a766',entity:true}
];"""
          new="""const paletteItems = [
  {id:0,name:'Empty',color:'#090811'},
  {id:32,name:'Ground A',color:'#6d586f'}, {id:33,name:'Ground B',color:'#79627d'},
  {id:34,name:'Ground C',color:'#856d89'}, {id:35,name:'Ground D',color:'#927895'},
  {id:36,name:'Ground E',color:'#9d84a0'}, {id:37,name:'Ground F',color:'#a88eaa'},
  {id:66,name:'Ice A',color:'#7ee5ef'}, {id:67,name:'Ice B',color:'#8dedf4'},
  {id:68,name:'Ice C',color:'#a1f1f6'}, {id:69,name:'Ice D',color:'#b4f5f8'},
  {id:17,name:'Spikes up',color:'#cfd7e7'}, {id:27,name:'Spikes down',color:'#cfd7e7'},
  {id:43,name:'Spikes left',color:'#cfd7e7'}, {id:59,name:'Spikes right',color:'#cfd7e7'},
  {id:1,name:'Player spawn',color:'#ff557f',special:'spawn'},
  {id:118,name:'Summit flag',color:'#80e78b',entity:true}, {id:18,name:'Spring',color:'#e54b67',entity:true},
  {id:22,name:'Dash balloon',color:'#79d8f5',entity:true}, {id:23,name:'Falling floor',color:'#e7ba62',entity:true},
  {id:26,name:'Strawberry',color:'#f44762',entity:true}, {id:28,name:'Flying berry',color:'#ff7790',entity:true},
  {id:64,name:'Fake wall',color:'#5f4564',entity:true}, {id:8,name:'Key',color:'#ffe66b',entity:true},
  {id:20,name:'Chest',color:'#ce9250',entity:true}, {id:11,name:'Platform left',color:'#a989d2',entity:true},
  {id:12,name:'Platform right',color:'#bba2e8',entity:true}, {id:86,name:'Message',color:'#e7e4ff',entity:true},
  {id:96,name:'Big chest',color:'#d9a766',entity:true}
];"""
          assert old in s
          s=s.replace(old,new)

          s=s.replace("for (let x=0;x<16;x++) tiles[15*16+x]=2;\n  for (let y=0;y<16;y++){ tiles[y*16]=2; tiles[y*16+15]=2; }",
                      "for (let x=0;x<16;x++) tiles[15*16+x]=37;\n  for (let y=0;y<16;y++){ tiles[y*16]=37; tiles[y*16+15]=37; }")
          s=s.replace("function freshProject(){return {version:1,", "function freshProject(){return {version:2,")
          s=s.replace("let tool='pencil', selected=2,", "let tool='pencil', selected=37,")

          old_rev="""function reviveProject(raw){
  if(!raw?.levels?.length) throw new Error('Project contains no levels');
  for(const level of raw.levels) for(const room of level.rooms) room.tiles=room.tiles instanceof Uint8Array?room.tiles:Uint8Array.from(room.tiles||[]);
  raw.activeLevel=Math.min(raw.activeLevel||0,raw.levels.length-1); raw.activeRoom=Math.min(raw.activeRoom||0,raw.levels[raw.activeLevel].rooms.length-1); return raw;
}"""
          new_rev="""function reviveProject(raw){
  if(!raw?.levels?.length) throw new Error('Project contains no levels');
  const migrate=(raw.version||1)<2;
  const legacy=new Map([[2,32],[3,33],[4,66],[5,67]]);
  for(const level of raw.levels) for(const room of level.rooms){
    room.tiles=room.tiles instanceof Uint8Array?room.tiles:Uint8Array.from(room.tiles||[]);
    if(migrate) for(let i=0;i<room.tiles.length;i++) if(legacy.has(room.tiles[i])) room.tiles[i]=legacy.get(room.tiles[i]);
  }
  raw.version=2;
  raw.activeLevel=Math.min(raw.activeLevel||0,raw.levels.length-1); raw.activeRoom=Math.min(raw.activeRoom||0,raw.levels[raw.activeLevel].rooms.length-1); return raw;
}"""
          assert old_rev in s
          s=s.replace(old_rev,new_rev)

          s=s.replace("  // Spawn/exit metadata are overlays; gameplay still exits through the top like Celeste Classic.\n  drawPicoSprite(ctx,1,room.spawnX*cell,room.spawnY*cell,cell,false,false,.72);\n  drawPicoSprite(ctx,118,room.exitX*cell,room.exitY*cell,cell,false,false,.58);",
                      "  // Spawn is editor metadata. Rooms advance only when the player exits through the top.\n  drawPicoSprite(ctx,1,room.spawnX*cell,room.spawnY*cell,cell,false,false,.72);")
          s=s.replace("  if(specialMode==='exit'){room.exitX=x;room.exitY=y;specialMode=null;renderPalette($('paletteSearch').value);return true}\n","")
          s=s.replace("$('setSpawn').onclick=()=>{specialMode='spawn';selected=1;renderPalette($('paletteSearch').value)};$('setExit').onclick=()=>{specialMode='exit';selected=118;renderPalette($('paletteSearch').value)};",
                      "$('setSpawn').onclick=()=>{specialMode='spawn';selected=1;renderPalette($('paletteSearch').value)};")
          p.write_text(s)

          p=Path('index.html')
          h=p.read_text()
          old_html="""      <section>
        <h2>Special positions</h2>
        <button id="setSpawn">Set player spawn</button>
        <button id="setExit">Set room exit</button>
        <p class="hint">Choose one, then click a grid cell.</p>
      </section>"""
          new_html="""      <section>
        <h2>Player spawn</h2>
        <button id="setSpawn">Set player spawn</button>
        <p class="hint">Rooms are completed by climbing out through the top edge, just like Celeste Classic. The summit flag is an optional entity, not the exit.</p>
      </section>"""
          assert old_html in h
          h=h.replace(old_html,new_html)
          p.write_text(h)
          PY

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app.js index.html
          git commit -m "Fix terrain sprite IDs and top-exit semantics"
          git push
