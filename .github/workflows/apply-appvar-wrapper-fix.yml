name: Apply Studio AppVar wrapper fix

on:
  push:
    branches: [agent/fix-studio-appvar-wrapper]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-studio-appvar-wrapper
      - name: Apply guarded fix
        run: python3 tools/apply_appvar_wrapper_fix.py
      - name: Run format tests
        run: npm test
      - name: Commit fixed source and tests
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/format.mjs tests/format.test.mjs
          git commit -m "Fix Studio AppVar payload layout"
          git push origin HEAD:agent/fix-studio-appvar-wrapper
